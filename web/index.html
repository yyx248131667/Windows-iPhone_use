<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows-iPhone_use 控制中心 (WebUI)</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --success-color: #22c55e;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    /* Header */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.25rem; font-weight: 700; color: #fff; }
    .brand span { color: var(--accent-color); }
    .status-badges { display: flex; gap: 12px; align-items: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
    }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-green { background-color: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
    .dot-red { background-color: var(--danger-color); }
    .dot-yellow { background-color: var(--warning-color); }

    /* Layout */
    .main-container {
      display: flex;
      flex: 1;
      padding: 20px;
      gap: 24px;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }
    .left-panel { flex: 1; min-width: 380px; max-width: 540px; display: flex; flex-direction: column; gap: 18px; }
    .right-panel { flex: 1.2; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }

    /* Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.3); }
    .btn-secondary { background: var(--bg-secondary); color: #e2e8f0; border: 1px solid var(--border-color); }
    .btn-secondary:hover:not(:disabled) { background: #334155; }

    /* Pipeline Checklist */
    .pipeline-steps { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.4);
      font-size: 0.84rem;
    }
    .step-name { display: flex; align-items: center; gap: 8px; color: #cbd5e1; }
    .step-state { font-size: 0.78rem; font-weight: 600; }
    .step-pending { color: var(--text-muted); }
    .step-running { color: var(--accent-color); animation: pulse 1.5s infinite; }
    .step-success { color: var(--success-color); }
    .step-failed { color: var(--danger-color); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Inputs */
    .input-group { display: flex; gap: 8px; }
    .input-text {
      flex: 1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .input-text:focus { border-color: var(--accent-color); }
    .select-dropdown {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    /* Terminal Console */
    .terminal {
      background: #090d16;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.78rem;
      height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-line { display: flex; gap: 8px; line-height: 1.4; word-break: break-all; }
    .log-time { color: #64748b; }
    .log-INFO { color: #94a3b8; }
    .log-WARNING { color: #f59e0b; }
    .log-ERROR { color: #ef4444; }

    /* iPhone Mockup Frame */
    .phone-container {
      position: relative;
      background: #18181b;
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), inset 0 0 0 3px #27272a, inset 0 0 0 4px #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }
    .phone-screen {
      position: relative;
      width: 375px;
      height: auto;
      aspect-ratio: 390 / 844;
      background: #000;
      border-radius: 38px;
      overflow: hidden;
      cursor: crosshair;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }
    .dynamic-island {
      position: absolute;
      top: 12px;
      width: 100px;
      height: 26px;
      background: #000;
      border-radius: 20px;
      z-index: 30;
      pointer-events: none;
    }
    .offline-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #64748b;
      text-align: center;
      padding: 24px;
    }

    /* Ripple Animation on Touch */
    .touch-ripple {
      position: absolute;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.5);
      border: 2px solid #38bdf8;
      transform: translate(-50%, -50%) scale(0.5);
      animation: ripple 0.4s ease-out forwards;
      pointer-events: none;
      z-index: 40;
    }
    @keyframes ripple {
      to { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
    }

    /* Screen Action Bar */
    .phone-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 8px 14px;
    }
    .btn-icon {
      background: transparent;
      border: none;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }
    .btn-icon:hover { background: rgba(255, 255, 255, 0.08); }
    .btn-icon.active { background: rgba(56, 189, 248, 0.2); color: var(--accent-color); }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/><path d="M12 12 2.1 10.5"/></svg>
      Windows-iPhone_use <span>WebUI</span>
    </div>
    <div class="status-badges">
      <div class="badge" id="badge-device">
        <div class="badge-dot dot-yellow" id="dot-device"></div>
        <span id="text-device">检测设备中...</span>
      </div>
      <div class="badge" id="badge-tunnel">
        <div class="badge-dot dot-red" id="dot-tunnel"></div>
        <span id="text-tunnel">隧道: 离线</span>
      </div>
      <div class="badge" id="badge-wda">
        <div class="badge-dot dot-red" id="dot-wda"></div>
        <span id="text-wda">WDA: 离线</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="main-container">

    <!-- Left Column: Controls & Pipeline -->
    <div class="left-panel">
      
      <!-- Card 1: One-Click Pipeline -->
      <div class="card">
        <div class="card-title">
          <span>⚡ 核心控制与自动化</span>
          <span style="font-size:0.75rem; color: var(--text-muted);" id="pipeline-status-text">就绪</span>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-primary" id="btn-start-all" style="flex:2;" onclick="startPipeline()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            一键全流程连接与启动
          </button>
          <button class="btn btn-danger" id="btn-stop-all" style="flex:1;" onclick="stopPipeline()">
            🛑 全部停止
          </button>
        </div>

        <!-- Checklist -->
        <div class="pipeline-steps">
          <div class="step-item">
            <span class="step-name">1. 发现已连接 iPhone</span>
            <span class="step-state step-pending" id="step-discovery">待检测</span>
          </div>
          <div class="step-item">
            <span class="step-name">2. 检查信任与配对</span>
            <span class="step-state step-pending" id="step-pairing">待检测</span>
          </div>
          <div class="step-item">
            <span class="step-name">3. iOS 17+ CoreDevice 隧道</span>
            <span class="step-state step-pending" id="step-tunnel">待启动</span>
          </div>
          <div class="step-item">
            <span class="step-name">4. XCTest 驱动启动 WDA</span>
            <span class="step-state step-pending" id="step-wda">待启动</span>
          </div>
          <div class="step-item">
            <span class="step-name">5. 会话初始化与屏幕同步</span>
            <span class="step-state step-pending" id="step-session">待就绪</span>
          </div>
        </div>
      </div>

      <!-- Card 2: Quick Operations -->
      <div class="card">
        <div class="card-title">⌨️ 快捷操作与输入</div>
        <!-- Text Input -->
        <div class="input-group">
          <input type="text" id="text-to-type" class="input-text" placeholder="输入要发送到 iPhone 的文字..." onkeydown="if(event.key==='Enter') sendText()">
          <button class="btn btn-secondary" onclick="sendText()">发送</button>
        </div>
        <!-- App Launch -->
        <div class="input-group">
          <select id="app-select" class="select-dropdown" style="flex: 1.2;">
            <option value="com.tencent.xin">微信</option>
            <option value="com.apple.Preferences">设置 (Preferences)</option>
            <option value="com.apple.mobilesafari">Safari 浏览器</option>
            <option value="com.apple.camera">相机 (Camera)</option>
            <option value="com.apple.AppStore">App Store</option>
            <option value="custom">输入自定义 Bundle ID...</option>
          </select>
          <input type="text" id="custom-bundle" class="input-text" placeholder="Bundle ID" style="display:none; flex: 1.5;">
          <button class="btn btn-secondary" id="btn-launch-app" onclick="launchApp()">启动 App</button>
        </div>
      </div>

      <div id="action-feedback" role="status" style="color:var(--text-muted);font-size:0.85rem;"></div>

      <!-- Card 3: Live Logs -->
      <div class="card">
        <div class="card-title">
          <span>📜 运行日志</span>
          <button class="btn-icon" style="padding:2px 8px; font-size:0.75rem;" onclick="clearLogs()">清屏</button>
        </div>
        <div class="terminal" id="log-terminal">
          <div class="log-line"><span class="log-time">[System]</span><span>WebUI 界面已就绪。正在连接服务...</span></div>
        </div>
      </div>

    </div>

    <!-- Right Column: Interactive Screen Mirror -->
    <div class="right-panel">
      <div class="card" style="margin-bottom:16px;">
        <div class="input-group" style="margin-bottom:8px;">
          <select id="display-mode" class="select-dropdown" onchange="changeDisplayMode()">
            <option value="auto">自动：优先 USB</option>
            <option value="usb">USB 连续画面</option>
            <option value="airplay">AirPlay 画面</option>
            <option value="wda">WDA 截图预览</option>
          </select>
          <button id="btn-airplay" class="btn btn-secondary" onclick="toggleAirPlay()">启动 AirPlay</button>
        </div>
        <p id="airplay-status" role="status" style="font-size:0.8rem;color:var(--text-muted);">正在检查 AirPlay 接收器…</p>
      </div>
      <div class="phone-container">
        <div class="phone-screen" id="phone-screen" onpointerdown="handleMouseDown(event)" onpointerup="handleMouseUp(event)" onpointercancel="mouseStart=null">
          <div class="dynamic-island"></div>
          
          <img id="airplay-img" style="display:none;" alt="AirPlay 画面" onload="airplayFrameLoaded()" onerror="airplayStreamFailed()">
          <img id="screen-img" src="" style="display:none;" alt="iPhone Screen">
          
          <div class="offline-placeholder" id="screen-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
            <div>
              <p style="font-weight:600; color:#cbd5e1; margin-bottom:4px;">未检测到画面</p>
              <p style="font-size:0.8rem;">请点击左侧「一键全流程连接与启动」</p>
            </div>
          </div>
        </div>

        <!-- Phone Action Bar -->
        <div class="phone-actions">
          <button class="btn-icon" onclick="triggerHome()" title="返回主屏幕">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home 键
          </button>
          <button class="btn-icon" onclick="triggerLock()" title="锁屏 / 解锁">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            锁屏
          </button>
          <button class="btn-icon" onclick="fetchScreen()" title="立即刷新一帧">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
            刷新截屏
          </button>
          <button class="btn-icon active" id="btn-sync" onclick="toggleSync()" title="实时同步屏幕">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="text-sync">实时同步</span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let isSyncing = true;
    let syncInterval = null;
    let mouseStart = null;
    let screenInFlight = false;
    let statusInFlight = false;
    let actionInFlight = false;
    let actionQueue = [];
    let wheelDelta = 0;
    let screenObjectURL = null;
    let airplayActive = false;
    let streamSource = "";
    let usbState = { running: false, streaming: false };
    let usbStatusInFlight = false;
    let gestureGeneration = 0;
    let airplayState = { running: false, streaming: false };
    let airplayStatusInFlight = false;
    let airplayRetryAfter = 0;
    let displayMode = "auto";
    let deviceResolution = { width: 390, height: 844 };

    // App select change
    document.getElementById("app-select").addEventListener("change", (e) => {
      const customInput = document.getElementById("custom-bundle");
      customInput.style.display = e.target.value === "custom" ? "block" : "none";
    });

    // Fetch complete system status
    async function updateStatus() {
      if (statusInFlight || document.hidden || actionInFlight) return;
      statusInFlight = true;
      try {
        const res = await fetch("/api/status/all");
        if (!res.ok) return;
        const data = await res.json();

        // 1. Device
        const dev = data.device;
        const dotDev = document.getElementById("dot-device");
        const txtDev = document.getElementById("text-device");
        if (dev && dev.udid) {
          dotDev.className = "badge-dot dot-green";
          txtDev.textContent = `${dev.device_name} (iOS ${dev.product_version})`;
        } else {
          dotDev.className = "badge-dot dot-red";
          txtDev.textContent = "未检测到 iPhone";
        }

        // 2. Tunnel
        const dotTunnel = document.getElementById("dot-tunnel");
        const txtTunnel = document.getElementById("text-tunnel");
        if (data.tunnel.alive) {
          dotTunnel.className = "badge-dot dot-green";
          txtTunnel.textContent = "隧道: 运行中";
        } else {
          dotTunnel.className = "badge-dot dot-red";
          txtTunnel.textContent = "隧道: 离线";
        }

        // 3. WDA
        wdaOnline = !!(data.wda && data.wda.online);
        const dotWDA = document.getElementById("dot-wda");
        const txtWDA = document.getElementById("text-wda");
        if (wdaOnline) {
          dotWDA.className = "badge-dot dot-green";
          txtWDA.textContent = "WDA: 在线";
        } else {
          dotWDA.className = "badge-dot dot-red";
          txtWDA.textContent = "WDA: 离线";
        }

        // 4. Session & Screen Size
        if (data.session && data.session.screen_size) {
          deviceResolution = data.session.screen_size;
          if (!airplayActive) document.getElementById("phone-screen").style.aspectRatio = `${deviceResolution.width} / ${deviceResolution.height}`;
        }

        // 5. Pipeline Steps
        const p = data.pipeline;
        if (p) {
          document.getElementById("pipeline-status-text").textContent = p.current_step || "就绪";
          for (let step in p.steps) {
            const el = document.getElementById(`step-${step}`);
            if (el) {
              const state = p.steps[step];
              el.className = `step-state step-${state}`;
              el.textContent = state === "success" ? "✓ 成功" : state === "running" ? "● 执行中..." : state === "failed" ? "✗ 失败" : "待执行";
            }
          }
          if (p.status === "error") {
            document.getElementById("pipeline-status-text").innerHTML = `<span style="color:#ef4444;">${p.error_message || "执行失败"}</span>`;
          }
        }
      } catch (e) {
        console.error("Status polling failed:", e);
      } finally {
        statusInFlight = false;
      }
    }

    let wdaOnline = false;

    // Capture & Mirror Screen
    async function fetchScreen() {
      if (!wdaOnline || screenInFlight || actionInFlight || document.hidden || airplayActive || ["airplay", "usb"].includes(displayMode)) return;
      screenInFlight = true;
      let nextURL = null;
      try {
        const res = await fetch("/api/screen/preview", { cache: "no-store" });
        if (!res.ok) return;
        nextURL = URL.createObjectURL(await res.blob());
        const frame = new Image();
        frame.src = nextURL;
        await frame.decode();
        const img = document.getElementById("screen-img");
        if (airplayActive || ["airplay", "usb"].includes(displayMode)) return;
        img.src = nextURL;
        if (screenObjectURL) URL.revokeObjectURL(screenObjectURL);
        screenObjectURL = nextURL;
        nextURL = null;
        img.style.display = "block";
        document.getElementById("screen-placeholder").style.display = "none";
      } catch (e) {
        console.debug("Screen update failed:", e);
      } finally {
        if (nextURL) URL.revokeObjectURL(nextURL);
        screenInFlight = false;
      }
    }

    function setAirPlayActive(active, source = "airplay") {
      const img = document.getElementById("airplay-img");
      if (active && (!airplayActive || streamSource !== source)) {
        gestureGeneration++;
        mouseStart = null;
        img.src = "/api/" + source + "/stream?t=" + Date.now();
      } else if (!active && airplayActive) {
        gestureGeneration++;
        mouseStart = null;
        img.removeAttribute("src");
      }
      streamSource = active ? source : "";
      airplayActive = active;
      img.style.display = active ? "block" : "none";
      document.getElementById("screen-img").style.display = active ? "none" : ["airplay", "usb"].includes(displayMode) ? "none" : screenObjectURL ? "block" : "none";
      document.getElementById("screen-placeholder").style.display = active || (!["airplay", "usb"].includes(displayMode) && screenObjectURL) ? "none" : "flex";
      if (!active) document.getElementById("phone-screen").style.aspectRatio = `${deviceResolution.width} / ${deviceResolution.height}`;
    }

    function airplayFrameLoaded() {
      const img = document.getElementById("airplay-img");
      if (airplayActive && img.naturalWidth && img.naturalHeight) {
        gestureGeneration++;
        mouseStart = null;
        document.getElementById("phone-screen").style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
      }
    }

    function airplayStreamFailed() {
      airplayRetryAfter = Date.now() + 3000;
      setAirPlayActive(false);
      fetchScreen();
    }

    function changeDisplayMode() {
      displayMode = document.getElementById("display-mode").value;
      gestureGeneration++;
      mouseStart = null;
      selectStream();
      updateUSBStatus();
      fetchScreen();
    }

    function selectStream() {
      if (document.hidden) { setAirPlayActive(false); return; }
      const usb = isSyncing && ["auto", "usb"].includes(displayMode) && usbState.streaming;
      const airplay = isSyncing && ["auto", "airplay"].includes(displayMode) && airplayState.streaming;
      setAirPlayActive(Date.now() >= airplayRetryAfter && (usb || airplay), usb ? "usb" : "airplay");
    }

    async function updateUSBStatus() {
      if (usbStatusInFlight || document.hidden) return;
      usbStatusInFlight = true;
      try {
        const enabled = isSyncing && wdaOnline && ["auto", "usb"].includes(displayMode);
        const res = await fetch("/api/usb/status?enabled=" + enabled);
        if (!res.ok) throw new Error("USB 画面连接失败");
        usbState = await res.json();
      } catch (e) {
        usbState = { running: false, streaming: false };
      } finally {
        usbStatusInFlight = false;
        selectStream();
      }
    }

    async function updateAirPlayStatus() {
      if (airplayStatusInFlight || document.hidden) return;
      airplayStatusInFlight = true;
      try {
        const res = await fetch("/api/airplay/status");
        if (!res.ok) return;
        airplayState = await res.json();
        document.getElementById("btn-airplay").textContent = airplayState.running ? "停止 AirPlay" : "启动 AirPlay";
        document.getElementById("airplay-status").textContent = usbState.streaming && ["auto", "usb"].includes(displayMode)
          ? "USB 连续画面已连接 · 点击与输入使用 WDA"
          : displayMode === "usb" ? (usbState.error || "正在连接 USB 连续画面…") : airplayState.streaming
          ? "AirPlay 画面已连接 · 点击与输入使用 WDA"
          : airplayState.running ? airplayState.message + (displayMode === "auto" ? "；暂用 WDA 预览" : "")
          : airplayState.error ? "接收器退出：" + airplayState.error : airplayState.available ? "接收器已就绪，点击启动后在手机上选择屏幕镜像" : "尚未安装接收器，可先使用 WDA 预览；安装方法见 README";
        selectStream();
      } catch (e) {
        airplayState.streaming = false;
        selectStream();
      } finally {
        airplayStatusInFlight = false;
      }
    }

    async function toggleAirPlay() {
      const button = document.getElementById("btn-airplay");
      button.disabled = true;
      try {
        const res = await fetch(airplayState.running ? "/api/airplay/stop" : "/api/airplay/start", { method: "POST" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "接收器启动失败");
        await updateAirPlayStatus();
      } catch (e) {
        document.getElementById("airplay-status").textContent = e.message;
      } finally {
        button.disabled = false;
      }
    }

    function actionRequest(url, payload) {
      const feedback = document.getElementById("action-feedback");
      if (actionQueue.length >= 2) {
        feedback.textContent = "操作较快，请等当前两项操作完成";
        return Promise.resolve(false);
      }
      return new Promise(resolve => {
        actionQueue.push({ url, payload, resolve });
        drainActions();
      });
    }

    async function drainActions() {
      if (actionInFlight) return;
      actionInFlight = true;
      const feedback = document.getElementById("action-feedback");
      try {
        while (actionQueue.length) {
          const item = actionQueue.shift();
          feedback.textContent = actionQueue.length ? `正在执行，另有 ${actionQueue.length} 项等待` : "正在执行…";
          feedback.style.color = "var(--text-muted)";
          const started = performance.now();
          try {
            const res = await fetch(item.url, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: item.payload === undefined ? undefined : JSON.stringify(item.payload)
            });
            const data = await res.json();
            if (!res.ok || data.success === false) throw new Error(data.detail || data.message || "操作失败");
            feedback.textContent = `操作完成 · ${Math.round(performance.now() - started)} ms`;
            item.resolve(true);
          } catch (e) {
            feedback.textContent = "操作失败：" + e.message;
            feedback.style.color = "#ef4444";
            item.resolve(false);
            // Coordinates of queued gestures may no longer refer to the same screen.
            for (const pending of actionQueue.splice(0)) pending.resolve(false);
          }
        }
      } finally {
        actionInFlight = false;
        fetchScreen();
      }
    }

    // Toggle Screen Sync
    function toggleSync() {
      isSyncing = !isSyncing;
      changeDisplayMode();
      const btn = document.getElementById("btn-sync");
      const txt = document.getElementById("text-sync");
      if (isSyncing) {
        btn.classList.add("active");
        txt.textContent = "实时同步";
        startSyncInterval();
      } else {
        btn.classList.remove("active");
        txt.textContent = "实时同步: 关";
        clearInterval(syncInterval);
      }
    }

    function startSyncInterval() {
      clearInterval(syncInterval);
      syncInterval = setInterval(() => {
        if (isSyncing && wdaOnline) fetchScreen();
      }, 300);
    }

    // Pipeline Start / Stop
    async function startPipeline() {
      const btn = document.getElementById("btn-start-all");
      btn.disabled = true;
      try {
        await fetch("/api/pipeline/start", { method: "POST" });
      } catch (e) {
        alert("启动失败: " + e);
      } finally {
        setTimeout(() => { btn.disabled = false; }, 2000);
      }
    }

    async function stopPipeline() {
      try {
        await fetch("/api/pipeline/stop", { method: "POST" });
      } catch (e) {
        alert("停止失败: " + e);
      }
    }

    // Map only the displayed image, excluding any letterboxing.
    function fittedRect(bounds, width, height) {
      const scale = Math.min(bounds.width / width, bounds.height / height);
      return { left: bounds.left + (bounds.width - width * scale) / 2,
               top: bounds.top + (bounds.height - height * scale) / 2,
               width: width * scale, height: height * scale };
    }

    function screenContentRect() {
      const img = document.getElementById(airplayActive ? "airplay-img" : "screen-img");
      return fittedRect(document.getElementById("phone-screen").getBoundingClientRect(),
                        img.naturalWidth || deviceResolution.width,
                        img.naturalHeight || deviceResolution.height);
    }

    function handleMouseDown(e) {
      if (e.isPrimary === false) { mouseStart = null; return; }
      if (e.button !== undefined && e.button !== 0) return;
      if (!wdaOnline) {
        document.getElementById("action-feedback").textContent = "WDA 未连接，暂时只能查看画面";
        return;
      }
      const rect = screenContentRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      if (x < 0 || x > 1 || y < 0 || y > 1) return;
      const screen = document.getElementById("phone-screen");
      if (e.pointerId !== undefined) screen.setPointerCapture(e.pointerId);
      mouseStart = { x, y, time: performance.now(), rect, generation: gestureGeneration };
      e.preventDefault();
    }

    async function handleMouseUp(e) {
      const start = mouseStart;
      mouseStart = null;
      if (!start) return;
      const screen = document.getElementById("phone-screen");
      if (e.pointerId !== undefined && screen.hasPointerCapture(e.pointerId)) screen.releasePointerCapture(e.pointerId);
      if (start.generation !== gestureGeneration || !wdaOnline) return;
      const currentRect = screenContentRect();
      if (Math.abs(currentRect.width - start.rect.width) > 1 || Math.abs(currentRect.height - start.rect.height) > 1) return;
      const endX = Math.max(0, Math.min(1, (e.clientX - start.rect.left) / start.rect.width));
      const endY = Math.max(0, Math.min(1, (e.clientY - start.rect.top) / start.rect.height));
      const duration = (performance.now() - start.time) / 1000;
      const dist = Math.hypot((endX - start.x) * start.rect.width, (endY - start.y) * start.rect.height);
      if (dist < 8) {
        if (duration > 0.7) return;
        await actionRequest("/api/action/tap", { normalized_x: start.x, normalized_y: start.y,
                            portrait: start.rect.height > start.rect.width });
      } else {
        await actionRequest("/api/action/swipe", {
          norm_from_x: start.x, norm_from_y: start.y,
          norm_to_x: endX, norm_to_y: endY,
          duration: Math.max(0.06, Math.min(0.7, duration))
        });
      }
    }

    let wheelAt = -Infinity;
    let wheelConsumed = false;
    document.getElementById("phone-screen").addEventListener("wheel", e => {
      if (e.ctrlKey || e.metaKey) return;
      e.preventDefault();
      const now = performance.now();
      if (now - wheelAt > 180) { wheelConsumed = false; wheelDelta = 0; }
      wheelAt = now;
      if (!wdaOnline || actionInFlight || mouseStart) { wheelConsumed = true; return; }
      if (wheelConsumed) return;
      const rect = screenContentRect();
      if (e.clientX < rect.left || e.clientX > rect.left + rect.width || e.clientY < rect.top || e.clientY > rect.top + rect.height) return;
      const horizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? rect.height : 1;
      wheelDelta += (horizontal ? e.deltaX : e.deltaY) * unit;
      if (!Number.isFinite(wheelDelta) || Math.abs(wheelDelta) < 24) return;
      wheelConsumed = true;
      const delta = wheelDelta;
      const distance = horizontal ? 0.65 : 0.45;
        const direction = delta > 0 ? -1 : 1;
        actionRequest("/api/action/swipe", {
          norm_from_x: horizontal ? 0.5 - direction * distance / 2 : 0.5,
          norm_from_y: horizontal ? 0.5 : 0.5 - direction * distance / 2,
          norm_to_x: horizontal ? 0.5 + direction * distance / 2 : 0.5,
          norm_to_y: horizontal ? 0.5 : 0.5 + direction * distance / 2,
          duration: 0.15
        });
    }, { passive: false });

    // Action Helpers
    async function sendText() {
      const input = document.getElementById("text-to-type");
      const text = input.value.trim();
      if (!text) return;
      if (await actionRequest("/api/action/type", { text })) input.value = "";
    }

    async function launchApp() {
      const select = document.getElementById("app-select");
      let bundleId = select.value;
      if (bundleId === "custom") {
        bundleId = document.getElementById("custom-bundle").value.trim();
      }
      if (!bundleId) {
        alert("请输入有效的应用 Bundle ID");
        return;
      }
      const button = document.getElementById("btn-launch-app");
      button.disabled = true;
      try {
        await actionRequest("/api/action/app/launch", { bundle_id: bundleId });
      } finally {
        button.disabled = false;
      }
    }

    async function triggerHome() {
      await actionRequest("/api/action/home");
    }

    async function triggerLock() {
      await actionRequest("/api/action/lock");
    }

    // Live Logs
    async function updateLogs() {
      try {
        const res = await fetch("/api/logs");
        if (!res.ok) return;
        const data = await res.json();
        const term = document.getElementById("log-terminal");
        if (data.logs && data.logs.length > 0) {
          term.innerHTML = data.logs.map(l => `
            <div class="log-line">
              <span class="log-time">[${l.time}]</span>
              <span class="log-${l.level}">${escapeHtml(l.message)}</span>
            </div>
          `).join("");
          term.scrollTop = term.scrollHeight;
        }
      } catch (e) {}
    }

    function clearLogs() {
      document.getElementById("log-terminal").innerHTML = "";
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    // Polling Loops
    document.addEventListener("visibilitychange", () => {
      mouseStart = null;
      gestureGeneration++;
      if (document.hidden) setAirPlayActive(false);
      else { updateUSBStatus(); updateAirPlayStatus(); fetchScreen(); }
    });
    setInterval(updateStatus, 2500);
    setInterval(updateLogs, 2000);
    setInterval(updateAirPlayStatus, 1500);
    setInterval(updateUSBStatus, 1500);
    updateUSBStatus();
    updateAirPlayStatus();
    startSyncInterval();
    updateStatus();
    updateLogs();
  </script>
</body>
</html>
